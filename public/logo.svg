<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded badge with a pencil mark in the center (no text — brand rename 2.0) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/> <!-- sky-400 -->
      <stop offset="1" stop-color="#14b8a6"/> <!-- teal-500 -->
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Badge ring: donut with gradient, and a dark interior chip -->
  <circle cx="256" cy="256" r="238" fill="url(#g)" filter="url(#sh)"/>
  <circle cx="256" cy="256" r="215" fill="#ffffff" opacity="0.92"/>

  <!-- Pencil mark (white, centered on the dark chip) -->
  <g transform="translate(256,256)" fill="none" stroke="#14b8a6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-80 80 L60 -20 L-24 -80 L-120 -16 Z"/>   <!-- pencil barrel/shaft -->
    <path d="M66 -26 L80 -40"/>                          <!-- pencil tip -->
  </g>

  <!-- Accent circle to reinforce gradient -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.12"/>
</svg>
